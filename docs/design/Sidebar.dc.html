<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>เมนูข้าง MT-QMS</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:#0F1E30}a:hover{color:#053D70}
</style>
</helmet>
<nav aria-label="เมนูหลัก" style="width: 100%; min-height: 1040px; box-sizing: border-box; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 20px; background: #FFFFFF; color: #0F1E30; font-family: 'IBM Plex Sans Thai', system-ui, sans-serif;">
  <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 0 8px 16px; border-bottom: 1px solid #E3EAF1;">
    <img src="../brand/mt-logo-full.png" alt="บริษัท เมดิคอลเทรนด์ จำกัด Medical Trend Co., Ltd." style="width: 176px; height: auto; display: block;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="font-weight: 700; font-size: 15px; color: #053D70;">MT-QMS</span>
      <span style="font-size: 12px; font-weight: 600; color: #FFFFFF; background: #0B6E99; border-radius: 999px; padding: 1px 8px;">MOPH LAB 2568</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 8px;">
    <label for="branch" style="font-size: 12px; color: #556476;">สาขาที่ดูอยู่</label>
    <select id="branch" style="height: 40px; border-radius: 8px; border: 1px solid #C8D3DE; background: #F3F6F9; color: #0F1E30; padding: 0 10px; font-family: inherit; font-size: 14px;">
      <option>ทุกสาขา</option>
      <option>ศูนย์แล็บเมดิคอลเทรนด์ (บ่อสร้าง)</option>
      <option>ราชพฤกษ์แล็บเชียงใหม่ (หางดง)</option>
      <option>ไอบลิส สหคลินิก (หนองหอย)</option>
      <option>เมดิคอลเทรนด์ เฮลธ์แคร์ พะเยา</option>
      <option>ห้องปฏิบัติการอณูชีววิทยา</option>
    </select>
  </div>

  <div style="display: flex; flex-direction: column; gap: 2px;">
    <span style="font-size: 11px; letter-spacing: 0.6px; color: #697889; padding: 8px 12px 6px;">ติดตามมาตรฐาน</span>
    <sc-for list="{{main}}" as="item" hint-placeholder-count="5">
      <a href="{{item.href}}" style="{{item.style}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.icon}}"></path></svg>
        <span style="flex-grow: 1;">{{item.label}}</span>
        <sc-if value="{{item.badge}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; font-weight: 600; background: #F2B544; color: #2B1A00; border-radius: 999px; padding: 1px 8px;">{{item.badge}}</span></sc-if>
      </a>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 2px;">
    <span style="font-size: 11px; letter-spacing: 0.6px; color: #697889; padding: 8px 12px 6px;">ทะเบียน</span>
    <sc-for list="{{reg}}" as="item" hint-placeholder-count="5">
      <a href="#top" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 8px; text-decoration: none; color: #33435A; font-size: 14px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.icon}}"></path></svg>
        <span>{{item.label}}</span>
      </a>
    </sc-for>
  </div>

  <div style="margin-top: auto; display: flex; align-items: center; gap: 12px; padding: 12px; border-top: 1px solid #E3EAF1;">
    <div style="width: 36px; height: 36px; border-radius: 999px; background: #E6F4FB; color: #053D70; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700;">ช</div>
    <div style="display: flex; flex-direction: column;">
      <span style="font-size: 14px; font-weight: 600;">ชนัตร</span>
      <span style="font-size: 12px; color: #556476;">กรรมการผู้จัดการ · Top Mgmt</span>
    </div>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dashboard","requirements","assessment","nc","calendar"],"default":"dashboard"},"$preview":{"width":248,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'dashboard';
    const base = 'display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px;';
    const on = base + ' background: #053D70; color: #FFFFFF; font-weight: 600;';
    const off = base + ' color: #0F1E30;';
    const items = [
      { key: 'dashboard', label: 'ภาพรวมความพร้อม', href: 'Main.dc.html', icon: 'M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z' },
      { key: 'requirements', label: 'ข้อกำหนด 90 ข้อ', href: 'Requirement.dc.html', icon: 'M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01' },
      { key: 'assessment', label: 'การตรวจประเมิน', href: 'Assessment.dc.html', icon: 'M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9' },
      { key: 'nc', label: 'NC / CAR', href: 'NC.dc.html', icon: 'M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z', badge: '9' },
      { key: 'calendar', label: 'ปฏิทินงานตามรอบ', href: 'Calendar.dc.html', icon: 'M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z', badge: '6' }
    ];
    return {
      main: items.map((it) => ({ ...it, badge: it.badge || false, style: it.key === active ? on : off })),
      reg: [
        { label: 'เอกสาร & Master List', icon: 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6' },
        { label: 'เครื่องมือ & สอบเทียบ', icon: 'M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z' },
        { label: 'บุคลากร & Competency', icon: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8' },
        { label: 'ความเสี่ยง & KPI', icon: 'M3 3v18h18M7 15l4-4 3 3 5-6' },
        { label: 'Management Review', icon: 'M17 21v-2a4 4 0 0 0-4-4H5M12 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0zM20 8v6M23 11h-6' }
      ]
    };
  }
}
</script>
</body>
</html>
